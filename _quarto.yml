project:
  type: website
  output-dir: _site
  pre-render: scripts/build_hub.py
  resources:
    - hub.js

website:
  title: "Phronesis · Φρόνησις"
  site-url: "https://1dzl0.github.io/research-notebook/"
  description: "A working notebook on adaptive, self-organising multi-agent systems."
  search: false

  navbar:
    background: "#F0EEE9"
    foreground: "#6A6478"
    right:
      - icon: github
        href: https://github.com/1DZL0/research-notebook
        aria-label: Source repository

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 3
    toc-location: right
    toc-title: "Contents"
    anchor-sections: true
    mermaid:
      theme: neutral
    include-in-header:
      - _fonts.html
      - mermaid-init.html
      - _hub-include.html
      - _status-badges.html
