name: Publish Quarto Website

on:
  push:
    branches: main

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v5

      - name: Render
        uses: quarto-dev/quarto-actions/render@v5

      - name: Publish
        uses: quarto-dev/quarto-actions/publish@v5
        with:
          target: gh-pages
